<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Logistics Control</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#A3E635",
            secondary: "#C084FC",
            "background-light": "#F3F4F6",
            "background-dark": "#0B0C15",
            "surface-light": "#FFFFFF",
            "surface-dark": "#161821",
            "accent-dark": "#1F2230",
          },
          fontFamily: {
            display: ["'Inter'", "sans-serif"],
            mono: ["'JetBrains Mono'", "monospace"],
          },
          borderRadius: {
            'DEFAULT': '1.25rem',
            '3xl': '1.5rem',
            '4xl': '2rem',
          },
          boxShadow: {
            'glow': '0 0 15px rgba(163, 230, 53, 0.3)',
            'glow-purple': '0 0 15px rgba(192, 132, 252, 0.3)',
            'neon': '0 0 10px rgba(163, 230, 53, 0.5), 0 0 20px rgba(163, 230, 53, 0.3)',
          }
        },
      },
    };
  </script>
  <script>
    // Áp dụng dark mode TRƯỚC first paint để tránh flash trắng
    (function() {
      var theme = localStorage.getItem('nexus_theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        if (!theme) localStorage.setItem('nexus_theme', 'dark');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4B5563;
    }

    .tech-grid {
      background-image: linear-gradient(rgba(163, 230, 53, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(163, 230, 53, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    @keyframes scan {
      0% {
        top: 0;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }

    .scanner-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #A3E635;
      box-shadow: 0 0 10px #A3E635;
      animation: scan 4s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    .tactical-cut {
      clip-path: polygon(10px 0, 100% 0,
          100% calc(100% - 10px), calc(100% - 10px) 100%,
          0 100%, 0 10px);
    }

    .radar-ring {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.33);
        opacity: 0;
      }

      80%,
      100% {
        opacity: 0;
      }
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      animation: marquee 30s linear infinite;
    }

    body {
      cursor: default;
      font-family: 'Inter', sans-serif;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 transition-colors duration-300">
  <div id="root"></div>
  <!-- Vite will handle the module loading -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
